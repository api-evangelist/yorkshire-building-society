  name: Yorkshire Building Society Account Information API
  description: >-
    OBIE Read/Write Account and Transaction Information (AISP) API v3.1.2 -
    lets FCA-authorised account information service providers retrieve account,
    balance, transaction, beneficiary, standing order, direct debit, product,
    party and statement data for consenting YBS and Chelsea Building Society
    payment-account customers. FAPI-secured (OAuth2/OIDC, mTLS, PSD2 SCA).
