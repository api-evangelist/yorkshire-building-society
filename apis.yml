- aid: yorkshire-building-society:ybs-confirmation-of-funds-api
  name: Yorkshire Building Society Confirmation of Funds API
  description: >-
    OBIE Read/Write Confirmation of Funds (CBPII) API v3.1.2 - lets
    FCA-authorised card-based payment instrument issuers set up a funds
