- aid: yorkshire-building-society:ybs-event-subscriptions-api
  name: Yorkshire Building Society Event Subscriptions API
  description: >-
    OBIE Read/Write Event Subscriptions API v3.1.2 - lets an onboarded TPP
    create, read and delete event subscriptions so it can receive
    aggregated-polling and real-time event notifications (for example consent
    revocation) for YBS and Chelsea Building Society Open Banking resources.
    FAPI-secured (OAuth2/OIDC, mTLS).
  humanURL: https://developers.ybs.co.uk/api-catalog/event-subscriptions-api
  baseURL: https://ob-ybs.api.ybs.co.uk/open-banking/v3.1/aisp
