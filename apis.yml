- aid: yorkshire-building-society:ybs-generate-access-token-api
  name: Yorkshire Building Society Generate Access Token API
  description: >-
    OBIE token endpoint (Generate Access Token API v3.1.0) - the OAuth2/OIDC
    token endpoint used by onboarded TPPs to exchange authorization codes and
    client credentials for access tokens against the YBS and Chelsea Building
