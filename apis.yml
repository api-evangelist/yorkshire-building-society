- aid: yorkshire-building-society:ybs-dynamic-client-registration-api
  name: Yorkshire Building Society Dynamic Client Registration API
  description: >-
    OBIE Dynamic Client Registration (DCR) API v3.1 - lets an FCA-authorised
    TPP present its OBIE/eIDAS software statement and register a client
    application with the YBS and Chelsea Building Society authorization servers.
    Part of the OBIE security profile; secured with mTLS and PS256-signed JWTs.
