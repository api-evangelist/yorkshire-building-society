name: Yorkshire Building Society
kind: company
description: >-
  Yorkshire Building Society (YBS) is a UK mutual building society founded in
  1864 and headquartered in Bradford, West Yorkshire. As a member-owned mutual
  rather than a shareholder-owned bank, it is owned by and run for the benefit
  of its savers and borrowers, with more than three million customers and around
  £66 billion in assets across the YBS Group, which trades under the Yorkshire
  Building Society, Chelsea Building Society (CBS), Norwich & Peterborough and
  Accord Mortgages brands. YBS is authorised by the Prudential Regulation
  Authority and regulated by the Financial Conduct Authority and the PRA as an
  FCA-authorised ASPSP. Although it is not one of the CMA9 banks mandated to
  build Open Banking, YBS is a voluntary participant in the UK Open Banking /
  PSD2 ecosystem and operates a public developer portal at developers.ybs.co.uk
  that documents its OBIE Read/Write API family - Account Information (AIS),
  Payment Initiation (PIS), Confirmation of Funds (CBPII), Event Subscriptions,
  Dynamic Client Registration, and token issuance - conformant to the Open
  Banking Implementation Entity (OBIE) Read/Write Data API Standard v3.1.2.
  Access to the production and sandbox surfaces (ob-ybs.api.ybs.co.uk /
  ob-che.api.ybs.co.uk and the matching sandbox hosts) is secured with
  FAPI-grade OAuth2/OIDC, PSD2 strong customer authentication, mutual-TLS
  transport authentication and PS256-signed JWTs, and is available to
  FCA-authorised third-party providers holding eIDAS/OBIE certificates.
