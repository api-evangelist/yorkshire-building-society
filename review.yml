actions:
  openapiHarvested: true
  openapiProvenance: OBIE shared standard v3.1.2 (not bank-proprietary)
  apisYmlUpdated: true
  reason: >-
    Bootstrapped YBS identity plus its real six-API OBIE Read/Write catalog and
    four verbatim OBIE-standard OpenAPI specs. No Open Data endpoint exists for
    this non-CMA9 mutual; nothing was fabricated.
